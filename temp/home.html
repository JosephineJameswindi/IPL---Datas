<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <title>Add Perfomance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
        }
        .header {
            background: linear-gradient(to right, #0d3b66, #1d4e89);
            color: white;
            padding: 40px;
            border-radius: 20px;
        }
        .card-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
       
        .btn-main {
            background: #0d3b66;
            color: white;
        }

        .btn-main:hover {
            background: #0d3b66;
        }
       
    </style>
</head>

<body class="container my-4">
    <form action="" method="post">
        {% csrf_token %}
    <div class="card-box mb-4">
        <h5 class="mb-3">Add Performance</h5>

        <div class="mb-3">
            <label class="form-label">Player Name</label>
            <input type="text" name="Name" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Team</label>
            <input type="text" name="Team" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Entry Category</label>
            <select class="form-select" name="Category">
                <option value="Batsman">Batsman</option>
                <option value="Bowler">Bowler</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Runs</label>
                <input type="number" name="Runs" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Balls Faced / Wicket</label>
                <input type="number" name="Ba_wi" class="form-control">
            </div>
        </div>

        <button class="btn btn-main w-100">Submit</button>
    </div>
    </form>
</body>
</html>
